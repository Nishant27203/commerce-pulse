services:
  - type: web
    name: commerce-pulse-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://commerce-pulse-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: commerce-pulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: commerce-pulse-api
          envVarKey: RENDER_EXTERNAL_URL
